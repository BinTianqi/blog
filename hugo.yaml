baseURL: "https://bintianqi.com/blog"
title: "Tanky's blog"
defaultContentLanguage: "zh"

disableAliases: true
disableKinds: ["rss", "robotstxt", "404"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

capitalizeListTitles: false

menus:
  main:
    - name: "Home"
      pageRef: "/"
      weight: 10
    - name: "Posts"
      pageRef: "/posts"
      weight: 20
    - name: "Tags"
      pageRef: "/tags"
      weight: 40

publishDir: "build"
